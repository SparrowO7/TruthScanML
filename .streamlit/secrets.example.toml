# Copy this file to .streamlit/secrets.toml for local development.
# Never commit the real secrets.toml file or share its keys.

# Optional: Google Fact Check Tools API key (free tier, no billing).
# Enables professional fact-check (ClaimReview) lookups in Online Verification.
# Without a key, the app simply skips this layer and still works fully free.
# Get one at https://developers.google.com/fact-check/tools/api
FACT_CHECK_API_KEY = ""

# Optional: Groq API key (free tier) for the AI second-opinion panel.
# Get one at https://console.groq.com
GROQ_API_KEY = ""
GROQ_MODEL = "openai/gpt-oss-120b"
